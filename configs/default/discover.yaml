# GitHub repository discovery reads metadata only; repositories are not cloned at this stage.
discovery:
  # Canonical base URL for the GitHub REST API.
  github_api_url: https://api.github.com
  # GitHub REST API version sent with requests.
  github_api_version: "2022-11-28"
  # Application identifier sent to GitHub in request headers.
  github_user_agent: FeatureBench/0.3.0
  # Host environment variable containing the GitHub token.
  github_token_env: GITHUB_TOKEN
  # Allowed primary repository languages in search mode; an empty list allows all languages.
  languages: [Python, JavaScript, TypeScript, Go]
  # Allowed SPDX license identifiers in search mode; an empty list allows all licenses.
  licenses: []
  # Keywords appended to GitHub search queries; an empty list adds no keywords.
  keywords: []
  # Optional TXT input file with one owner/repo or GitHub URL per line; null disables file input.
  repositories_file: null
  # Repositories to fetch metadata for explicitly; an empty list uses search mode.
  target_repositories: []
  # Include only repositories created at or after this time.
  created_after: 2008-01-01T00:00:00Z
  # Include only repositories created at or before this time; null sets no upper bound.
  created_before: null
  # Include only repositories pushed to at or after this time; null sets no lower bound.
  pushed_after: null
  # Include only repositories pushed to at or before this time; null sets no upper bound.
  pushed_before: null
  # Minimum repository star count.
  minimum_stars: 100
  # Maximum repository star count; null sets no limit.
  maximum_stars: null
  # An integer selects the global top K; null uses lossless historical partitioning to fetch all matches.
  maximum_repositories: 100
  # Whether to exclude forked repositories.
  exclude_forks: true
  # Whether to exclude archived repositories.
  exclude_archived: true
  # Whether to include only public repositories.
  public_only: true
  # GitHub search sort field: updated or stars.
  sort: updated
  # GitHub search sort order: desc or asc.
  order: desc
  # Records returned per GitHub API page; at most 100.
  requests_per_page: 100
  # Maximum results covered by a single search partition in lossless mode.
  partition_result_limit: 900
  # Maximum days covered by a single time partition in lossless mode.
  partition_max_span_days: 365
  # Concurrent partition fetch tasks in lossless mode.
  partition_concurrency: 4
  # Maximum concurrent requests to the GitHub API.
  max_concurrent_requests: 8
  # Wall-clock timeout in seconds for a single GitHub API request.
  request_timeout_seconds: 30
  # Total attempts for a GitHub API operation, including retries after failure.
  request_attempts: 5
  # Initial exponential backoff in seconds for GitHub API network retries.
  retry_base_seconds: 1
  # Maximum backoff in seconds for GitHub API network retries.
  retry_max_seconds: 60
  # Additional retries when GitHub returns incomplete_results.
  incomplete_results_retries: 3
  # Refetch attempts when results change during pagination of a lossless partition.
  partition_consistency_retries: 2
  # Default wait in seconds when GitHub provides no rate-limit reset time.
  rate_limit_fallback_seconds: 60
