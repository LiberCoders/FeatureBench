# Data generation configuration for the FeatureBench adapter.
featurebench:
  # Number of environments processed concurrently; each environment corresponds to one repository.
  environment_concurrency: 8
  # Global end-to-end seed pipeline slots shared by this Generate/Resume run; each slot remains occupied from Top through final Gold Closure.
  seed_concurrency: 16
  # easy_first schedules by deterministic feasibility and estimated cost; path preserves file path order.
  seed_ordering: easy_first

  # ---------- Data quality ----------
  # Absolute minimum production-code line count in the gold patch.
  gold_patch_line_minimum: 200
  # Prefer solving between this value and the maximum; fall back to the minimum only after the preferred range is proven infeasible.
  gold_patch_line_preferred_minimum: 600
  # Absolute maximum production-code line count in the gold patch.
  gold_patch_line_maximum: 1000
  # Minimum number of F2P test points to produce.
  minimum_f2p_test_points: 1
  # Absolute maximum F2P test points; null sets no limit.
  maximum_f2p_test_points: null
  # Maximum physical test files contributing selected P2P points, limiting file-level import, fixture, and collection costs; null sets no limit.
  maximum_selected_p2p_test_files: 64
  # Minimum P2P test points to retain in the final selection.
  minimum_remaining_p2p_test_points: 10
  # Maximum P2P test points; select representative points when exceeded rather than rejecting the seed; null retains as many as possible.
  maximum_p2p_test_points: 3000
  # Maximum F2P / (F2P + P2P) ratio.
  maximum_f2p_ratio: 0.7
  # Maximum fraction of test points in the seed test file allowed to keep passing.
  maximum_seed_pass_rate: 0.9
  # Maximum tasks successfully produced per environment; null tries all valid seeds.
  maximum_tasks_per_environment: null

  # ---------- Top candidate selection ----------
  # Maximum depth for finding Top candidates along the dynamic call graph.
  top_max_depth: 5
  # Dynamic candidate objects examined per independent Top LLM call.
  top_batch_size: 20
  # Concurrent Top LLM calls at the same BFS depth within one test file.
  top_batch_concurrency: 1

  # ---------- Repair after masking ----------
  repair:
    # rollback uses deterministic batch rollback; agent uses the Repair Agent configured below.
    strategy: rollback
    # first_accepted stops at the first plan satisfying all hard constraints; interval_center continues toward the center of the range.
    optimization_target: first_accepted
    # Maximum unique actual validations started by rollback, excluding initial validation and cache hits.
    maximum_validations: 10
    # Total wall-clock limit for deterministic rollback; agent mode uses agent.repair.run_timeout_seconds.
    timeout_seconds: 3600

  # ---------- Adapter Agent ----------
  # Agent run concurrency limit shared by Top, Repair, and Issue Author in this Generate/Resume run.
  agent_concurrency: 4
  # This configuration belongs only to the FeatureBench adapter; it does not read or inherit agent settings from build.yaml.
  agent:
    # Model service transport settings shared by adapter agents.
    provider:
      # Whether to verify the model service's TLS certificate; set to false only when explicitly required by a proxy service.
      tls_verify: true
    # Maximum consecutive ModelRetry retries for the same tool; reset independently when that tool succeeds.
    tool_retries: 10
    # Total retry limit for structured output validation failures within one agent run.
    output_retries: 10
    # Maximum retries for transient model transport failures within one agent run, excluding the initial request.
    transient_request_retries: 10
    # Network timeout for a single model API request; does not limit the number of turns in an agent run.
    request_timeout_seconds: 600
    # Timeout for a single agent tool call; timeouts are reported to the model as ModelRetry.
    tool_timeout_seconds: 180

    # The Top Classifier only classifies candidates supplied by deterministic BFS.
    top:
      # Pydantic AI model name used by the Top Classifier.
      model: openai:gpt-5.6-terra
      # Wall-clock limit for one complete agent run on a single candidate batch.
      run_timeout_seconds: 3600

    # When repair.strategy=agent, iteratively submit mask repair plans in the actual environment.
    repair:
      # Pydantic AI model name used by the Repair Agent.
      model: openai:gpt-5.6-terra
      # Wall-clock limit for the entire conversation, which may include multiple submissions and actual validations.
      run_timeout_seconds: 3600

    # Write the problem statement for the final Top interface.
    issue_author:
      # Pydantic AI model name used by the Issue Author Agent.
      model: openai:gpt-5.6-terra
      # Wall-clock limit for one complete Issue Author Agent run.
      run_timeout_seconds: 3600

    # Summary metrics settings for adapter agents.
    metrics:
      # Whether to append one summary metrics record per complete agent run.
      enabled: true
      # Host path for adapter agent metrics JSONL.
      path: .featurebench/agent-metrics.jsonl
    # Token prices used to estimate adapter agent costs.
    pricing:
      # Proxy service prices in USD per million input/output tokens; configure both together, or use null for built-in catalog estimates.
      input_per_million_usd: null
      # Proxy service price in USD per million output tokens; null uses built-in catalog estimates.
      output_per_million_usd: null
      # Proxy service price in USD per million cache read tokens; null disables custom pricing.
      cache_read_per_million_usd: null
      # Proxy service price in USD per million cache write tokens; null disables custom pricing.
      cache_write_per_million_usd: null
    # Full trajectory retention policy for adapter agents.
    trajectory:
      # Whether to save full prompts, responses, tool calls, retries, and resumable snapshots.
      enabled: true
      # Host root directory for separate logical agent runs.
      directory: .featurebench/agent-trajectories
      # failures retains full trajectories only for failed or rejected seeds; all retains every trajectory.
      retention: failures
    # Manage only the active context, not cumulative requests or tokens.
    compaction:
      # Target context token count that triggers the harness's layered compaction.
      target_tokens: 240000
      # Maximum estimated tokens allowed in a single message part before compaction.
      max_part_tokens: 50000
      # Leading characters to retain when truncating an oversized part.
      keep_head_chars: 2000
      # Trailing characters to retain when truncating an oversized part.
      keep_tail_chars: 2000
      # Number of recent complete tool call/result pairs to retain when clearing older tool results.
      keep_tool_pairs: 6
      # Older tool results below this estimated token count are not worth clearing individually.
      min_clear_tokens: 4000
      # Number of recent messages to preserve verbatim after final summary compaction.
      keep_messages: 20

  # ---------- Execution, concurrency, and optimization ----------
  # pytest command; dynamic tracing reuses its arguments.
  test_command: [pytest, -q]
  # Wall-clock limit shared by environment-level pytest/Trace compatibility checks and tiered Runner throughput prechecks.
  compatibility_timeout_seconds: 120
  # Wall-clock limit for running the full F2P + P2P set in one Runner call; the final task uses the same value.
  full_test_timeout_seconds: 600
  # Total wall-clock budget per candidate validation, shared by failed batches and diagnostic fallback; fallback cannot qualify a candidate for acceptance.
  validation_timeout_seconds: 3600
  # Total wall-clock budget for one batch dynamic trace of a physical test file; do not split and retry after failure.
  trace_timeout_seconds: 600
  # Maximum test files traced concurrently across this Generate/Resume run; each tracing task uses a separate container.
  trace_concurrency: 24
  # Wall-clock limit for joint CP-SAT optimization of one seed.
  optimizer_timeout_seconds: 60
  # CP-SAT thread count; 1 ensures reproducible results under the time limit.
  optimizer_workers: 1
  # Deterministic random seed.
  random_seed: 0

  # ---------- Input size limits ----------
  # Maximum bytes in one dynamic call graph report; reject oversized reports rather than truncating them.
  maximum_trace_report_bytes: 200000000
  # Wall-clock timeout for source snapshots and AST indexing.
  index_timeout_seconds: 300
  # Maximum files read during source indexing.
  maximum_index_files: 10000
  # Maximum bytes per indexed file; skip files exceeding the limit.
  maximum_index_file_bytes: 2000000
  # Maximum total bytes in one repository source snapshot.
  maximum_index_total_bytes: 100000000

  # ---------- Problem statement ----------
  # Library name shown in the problem statement; null extracts it automatically from owner/repository.
  library_name: null
  # URLs that the problem statement prohibits accessing.
  black_links: []

  # ---------- Auditing and safety ----------
  audit:
    # failures retains full candidate artifacts only for failed or rejected candidates; all retains every candidate's artifacts.
    retention: failures
  # Critical Python magic methods that must never be removed.
  critical_magic_methods:
    # Preserve object instance creation.
    - __new__
    # Preserve object initialization.
    - __init__
    # Preserve dynamic resolution of missing attributes.
    - __getattr__
    # Preserve all attribute reads.
    - __getattribute__
    # Preserve attribute writes.
    - __setattr__
    # Preserve synchronous context manager entry.
    - __enter__
    # Preserve synchronous context manager exit.
    - __exit__
    # Preserve asynchronous context manager entry.
    - __aenter__
    # Preserve asynchronous context manager exit.
    - __aexit__