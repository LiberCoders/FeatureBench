    - name: python-3.12
      image: ubuntu:24.04
      languages: [python]
      runtime_family: python
      runtime_version: "3.12"
      capabilities: [bash, git, pip, uv, conda, build-toolchain]
      gpu_support: false
      recipe: python-3.12
      description: Python projects using pytest or another Python test runner.
    - name: python-3.11
      image: ubuntu:22.04
      languages: [python]
