# Number of repositories to build concurrently; not the CPU count per container.
concurrency: 4

repository:
  # Git executable on the host.
  git_binary: git
  # Wall-clock timeout for each Git command, including clone, fetch, submodule, and LFS operations.
  command_timeout_seconds: 1200
  # Total attempts for Git network commands against the same official URL when no github_git source is configured.
  # With a source configured, sources.services.github_git.maximum_attempts limits the number of endpoints instead.
  network_attempts: 3
  # Initial exponential backoff in seconds for Git network retries.
  retry_base_seconds: 2
  # Git HTTP transfer rate in bytes per second below which a connection is considered stalled.
  low_speed_bytes_per_second: 1024
  # Seconds of sustained low-speed Git HTTP transfer before switching to the next source.
  low_speed_timeout_seconds: 30
  # Fetch blobs on demand during clone to reduce temporary disk and network usage.
  partial_clone: true
  # Whether to recursively materialize submodules declared by the repository.
  update_submodules: true
  # Number of parallel submodule download jobs.
  submodule_jobs: 4
  # Whether to download actual Git LFS objects; when enabled, Build checks for git-lfs on the host before submitting tasks.
  fetch_lfs: true
  # Age in seconds after which a staging directory without an active lease is eligible for cleanup.
  stale_checkout_seconds: 86400

docker:
  # Docker CLI executable on the host.
  binary: docker
  # Network mode for built containers during analysis, validation, and adapter execution.
  network: none
  # Network mode during Docker builds; dependency installation requires network access.
  build_network: default
  # Whether to refresh upstream base images before building.
  pull: true
  # Default timeout for ordinary Docker commands such as create, start, exec, and inspect.
  command_timeout_seconds: 300
  # Wall-clock timeout for docker pull against one image source; switch to the next source on timeout.
  pull_timeout_seconds: 900
  # Wall-clock timeout for docker build.
  build_timeout_seconds: 3600
  # Maximum trailing characters retained separately from stdout and stderr for each Docker command.
  max_output_chars: 100000
  # Container CPU limit; null leaves the decision to Docker and the host.
  cpus: 8
  # Container memory limit, such as 8g; null adds no limit.
  memory: 16g
  # Passed to docker create --gpus only for repositories that require a GPU; null means no GPU is configured.
  gpus: null

# Pydantic AI and pydantic-ai-harness run only on the host and are not installed in task images.
agent:
  # Pydantic AI model name used by all environment build agents.
  model: openai:gpt-5.6-luna
  provider:
    # Whether to verify the model service's TLS certificate; set to false only when explicitly required by a proxy service.
    tls_verify: true
  # Maximum consecutive ModelRetry retries for the same tool; reset independently when that tool succeeds.
  tool_retries: 10
  # Total retry limit for structured output validation failures within one agent run.
  output_retries: 10
  # Maximum retries for transient model transport failures within one agent run, excluding the initial request.
  transient_request_retries: 10
  # Wall-clock timeout for one complete Analysis Agent run.
  analysis_run_timeout_seconds: 600
  # Wall-clock timeout for one complete Artifact Agent run.
  artifact_run_timeout_seconds: 600
  # Wall-clock timeout for the independent Runner Review Agent to review the complete Runner source.
  runner_review_run_timeout_seconds: 300
  # Network timeout for a single model API request; does not limit the number of turns in an agent run.
  request_timeout_seconds: 180
  # Timeout for a single agent tool call; timeouts are reported to the model as ModelRetry.
  tool_timeout_seconds: 180
  metrics:
    # Whether to append one summary metrics record per complete agent run.
    enabled: true
    # Host path for agent metrics JSONL.
    path: .featurebench/agent-metrics.jsonl
  pricing:
    # Proxy service prices in USD per million input/output tokens; configure both together, or use null for built-in catalog estimates.
    input_per_million_usd: null
    output_per_million_usd: null
    # Proxy service prices in USD per million cache read/write tokens; null disables custom pricing.
    cache_read_per_million_usd: null
    cache_write_per_million_usd: null
  trajectory:
    # Whether to save full prompts, responses, tool calls, retries, and resumable snapshots.
    enabled: true
    # Root directory for separate logical agent runs; network retries are written to individual attempt-* subdirectories.
    directory: .featurebench/agent-trajectories
    # failures retains trajectories only for failed or rejected repositories long-term; all retains every repository's trajectories.
    retention: failures
  # The following settings manage only the active context, not cumulative requests or tokens.
  compaction:
    # Target context token count that triggers the harness's layered compaction.
    target_tokens: 240000
    # Maximum estimated tokens allowed in a single message part before compaction.
    max_part_tokens: 50000
    # Leading characters to retain when truncating an oversized part.
    keep_head_chars: 2000
    # Trailing characters to retain when truncating an oversized part.
    keep_tail_chars: 2000
    # Number of recent complete tool call/result pairs to retain when clearing older tool results.
    keep_tool_pairs: 6
    # Older tool results below this estimated token count are not worth clearing individually.
    min_clear_tokens: 4000
    # Number of recent messages to preserve verbatim after final summary compaction.
    keep_messages: 20

environment:
  # Canonical repository path inside every task image.
  workdir: /testbed
  # Language-neutral image used by Analysis/Artifact Agents for initial repository inspection.
  planner_image: ubuntu:24.04
  # false rejects only repositories whose tests require a GPU; repositories with optional GPU support may still use CPU execution.
  allow_gpu_repositories: false
  # Wall-clock limit for each clone/fetch/checkout/submodule/LFS Git command in the self-contained Dockerfile.
  clone_command_timeout_seconds: 300
  # Git transfer rate in bytes per second below which a source is considered stalled in the self-contained Dockerfile.
  clone_low_speed_bytes_per_second: 1024
  # Seconds of sustained low-speed Git transfer in the self-contained Dockerfile before failing the build and switching sources.
  clone_low_speed_timeout_seconds: 30
  # Wall-clock limit for each Runner test collection or Quickcheck sample run.
  collect_timeout_seconds: 600
  # Minimum test points: repair immediately if collection falls short; reject the environment if actual passes after the full baseline fall short.
  min_verified_test_points: 10
  # Group the full baseline by test file, then split deterministically at this limit to prevent oversized files from creating unbounded Runner requests.
  baseline_group_max_test_points: 100
  # Total wall-clock budget shared by all full-baseline groups; each group uses the remaining time, and no new groups start once it is exhausted.
  baseline_total_timeout_seconds: 1800
  # Total wall-clock limit per repository, from online cloning through agent analysis, artifact authoring, and all build/validation/repair steps; on timeout, mark it failed and clean up candidate containers and intermediate images.
  total_timeout_seconds: 7200
  # Quickcheck test points sampled deterministically from collection using the commit and test IDs; use all if fewer are available, i.e. min(configured value, collected count).
  quickcheck_test_points: 10
  # Minimum actual pass rate for the Quickcheck sample; a lower rate returns the environment or Runner to the agent for repair.
  quickcheck_min_pass_rate: 0.5
  # Number of consecutive runs that must produce identical test collection results.
  collect_stability_runs: 2
  # Maximum build/validation attempts, returning actual failures to the agent for repair; abandon the repository only after 10 attempts.
  max_build_attempts: 10
  # Whether to delete unused intermediate image tags after repair succeeds or fails.
  cleanup_intermediate_images: true
  audit:
    # Whether to also generate a directory bundle for human auditing; JSONL remains the authoritative output.
    enabled: false
    # Host root directory for audit bundles.
    directory: .featurebench/audit/environments
  # Agents may select base images only from this catalog; each field is documented on the first entry only.
  base_images:
    # Stable, unique candidate name within the configuration.
    - name: generic-ubuntu
      # Official base image reference required in agent artifacts.
      image: ubuntu:24.04
      # Normalized language labels supported by this candidate.
      languages: [generic]
      # Language family used for environment activation and runtime selection.
      runtime_family: generic
      # Runtime version; null means no fixed language version.
      runtime_version: null
      # Capabilities preinstalled by the managed recipe that agents may rely on.
      capabilities: [bash, git, build-toolchain]
      # Whether this candidate can run tests that require a GPU.
      gpu_support: false
      # Managed recipe asset name to inline into the final Dockerfile.
      recipe: generic-ubuntu
      # Selection guidance provided to the Analysis Agent.
      description: Generic Debian-family base for repositories with custom toolchains.
    - name: python-3.14
      image: ubuntu:24.04
      languages: [python]
      runtime_family: python
      runtime_version: "3.14"
      capabilities: [bash, git, pip, uv, conda, build-toolchain]
      gpu_support: false
      recipe: python-3.14
      description: Python 3.14 projects using pytest or another Python test runner.
    - name: python-3.13
      image: ubuntu:24.04
      languages: [python]
      runtime_family: python
