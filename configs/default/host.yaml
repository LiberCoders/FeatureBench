# Host workspace for the FeatureBench data factory; relative paths resolve from the project launch directory.
workspace: .featurebench
# Maximum Rich panel refreshes per second.
refresh_per_second: 8
# Number of JSONL records to append between fsync calls.
jsonl_fsync_interval: 1
# Host dotenv file for credentials; does not override existing process environment variables.
env_file: .env
